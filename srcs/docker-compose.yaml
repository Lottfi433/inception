services:
  nginx:
    image: nginx:inception
    pull_policy: build
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      - wordpress
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: unless-stopped
  mariadb:
    image: mariadb:inception
    pull_policy: build
    build: ./requirements/mariadb
    secrets:
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test:
      - CMD-SHELL
      - 'MYSQL_PWD="$$(cat /run/secrets/db_password)" mariadb --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" --skip-ssl -e "SELECT 1;"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    restart: unless-stopped

  wordpress:
    image: wordpress:inception
    pull_policy: build
    depends_on:
      mariadb:
        condition: service_healthy
    build: ./requirements/wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
      - redis_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      WP_TITLE: ${WP_TITLE}
      NORMAL_USER_USERNAME: ${NORMAL_USER_USERNAME}
      NORMAL_USER_EMAIL: ${NORMAL_USER_EMAIL}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_HOST: ${MYSQL_HOST}
    restart: unless-stopped
#bonus
  redis:
    image: redis:inception
    pull_policy: build
    build: ./requirements/bonus/redis
    networks:
      - inception
    secrets:
      - redis_password
    restart: unless-stopped
  ftp:
    image: ftp:inception
    pull_policy: build
    build: ./requirements/bonus/ftp
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    restart: unless-stopped
  website:
    image: website:inception
    pull_policy: build
    build: ./requirements/bonus/website
    networks:
      - inception
    restart: unless-stopped
  adminer:
    image: adminer:inception
    pull_policy: build
    build: ./requirements/bonus/adminer
    networks:
      - inception
    restart: unless-stopped
  cadvisor:
    image: cadvisor:inception
    pull_policy: build
    build: ./requirements/bonus/cadvisor
    networks:
      - inception
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
#utils
secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file:  ../secrets/wp_admin_password.txt
  wp_user_password:
    file:  ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yazlaigi/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yazlaigi/data/wordpress
networks:
  inception:
    driver: bridge
